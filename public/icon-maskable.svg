<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo completo cuadrado sin esquinas redondeadas para modo maskable -->
  <rect width="512" height="512" fill="#2F6B63"/>

  <!-- Iconografía dentro de la zona segura central (radio 40% / diámetro 80%) -->
  <g fill="none" stroke="#F8F5EE" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cápsula del micrófono -->
    <rect x="222" y="146" width="68" height="128" rx="34" fill="#F8F5EE" stroke="none"/>
    
    <!-- Ranuras estéticas del micrófono -->
    <line x1="238" y1="184" x2="274" y2="184" stroke="#2F6B63" stroke-width="6"/>
    <line x1="238" y1="204" x2="274" y2="204" stroke="#2F6B63" stroke-width="6"/>
    <line x1="238" y1="224" x2="274" y2="224" stroke="#2F6B63" stroke-width="6"/>

    <!-- Soporte / Cuna del micrófono -->
    <path d="M 180 234 C 180 306 332 306 332 234" stroke-width="18"/>

    <!-- Pie y base -->
    <line x1="256" y1="306" x2="256" y2="352" stroke-width="18"/>
    <line x1="206" y1="352" x2="306" y2="352" stroke-width="18"/>

    <!-- Ondas de voz sutiles laterales dentro de la zona segura -->
    <path d="M 148 206 C 136 224 136 244 148 262" stroke-width="12" opacity="0.75"/>
    <path d="M 364 206 C 376 224 376 244 364 262" stroke-width="12" opacity="0.75"/>
  </g>
</svg>
